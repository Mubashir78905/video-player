<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Video Library</title>
  <link rel="stylesheet" href="style.css">
  <!-- No external dependencies — pure HTML, CSS, JS -->
</head>
<body>

  <!-- ============================================================
       TOP BAR
       ============================================================ -->
  <header class="topbar">
    <button class="topbar-menu-btn" id="menuToggle" aria-label="Toggle sidebar" title="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>

    <a href="index.html" class="topbar-logo" title="Home">
      <!-- <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="3" fill="#ff0000"/>
        <path d="M10 9l6 3-6 3z" fill="#fff"/>
      </svg> -->
      <span style="font-family: 'Consolas', monospace; font-weight: 700; font-size: 22px; color: #3ea6ff; letter-spacing: -1px;">&lt;/&gt;</span>
      <!-- <span>My<span class="logo-accent">Tube</span></span> -->
    </a>

    <form class="topbar-search" id="searchForm" onsubmit="return false;">
      <input type="text" id="searchInput" placeholder="Search videos…" autocomplete="off">
      <button type="button" id="searchClearBtn" class="search-clear hidden" title="Clear">✕</button>
      <button type="submit" class="search-submit" title="Search">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>

    <div class="topbar-actions">
      <a href="admin.html" class="topbar-btn" title="Admin / Upload helper">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 4v12m0-12l-4 4m4-4l4 4M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <span class="btn-label">Admin</span>
      </a>
    </div>
  </header>

  <!-- ============================================================
       PAGE BODY
       ============================================================ -->
  <div class="page-body">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active" data-view="all" id="navAllVideos">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <span>All Videos</span>
        </a>
        <a href="#" class="sidebar-link" data-view="folders" id="navFolders">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
          <span>Folders</span>
        </a>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-section-title">FOLDERS</div>
        <ul class="sidebar-folder-list" id="sidebarFolderList"></ul>
      </div>

      <div class="sidebar-footer">
        <span id="sidebarStats">0 videos</span>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">

      <!-- Breadcrumb / back button shown only when inside a folder -->
      <div class="breadcrumb-bar hidden" id="breadcrumbBar">
        <button class="back-btn" id="backBtn" title="Back">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <span class="breadcrumb-text" id="breadcrumbText">Folder</span>
        <span class="breadcrumb-count" id="breadcrumbCount"></span>
      </div>

      <!-- Section title -->
      <div class="section-header" id="sectionHeader">
        <h1 id="sectionTitle">All Videos</h1>
      </div>

      <!-- Folders grid (only shown on home) -->
      <section class="folders-section" id="foldersSection">
        <div class="folders-grid" id="foldersGrid"></div>
      </section>

      <!-- Videos grid -->
      <section class="videos-section">
        <div class="videos-grid" id="videosGrid"></div>
      </section>

      <!-- Empty state -->
      <div class="empty-state hidden" id="emptyState">
        <svg viewBox="0 0 24 24" width="64" height="64"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10 10l5 2-5 2z" fill="currentColor"/></svg>
        <h2 id="emptyTitle">No videos found</h2>
        <p id="emptyMessage">Add videos to your /videos folder and update videos.json.</p>
      </div>

    </main>

  </div>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="site-footer">
    <span>Personal Video Library &middot; Static &middot; No tracking</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
